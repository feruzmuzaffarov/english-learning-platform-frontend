<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - English Learning Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🌍 English Learning</h1>
            <ul class="nav-links">
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="login.html">Kirish</a></li>
                <li><a href="register.html">Ro'yxatdan o'tish</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Platformaga Ro'yxatdan o'tish</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="firstName">Ismingiz:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Familiyangiz:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Parol:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="role">Rol tanlang:</label>
                    <select id="role" name="role" required>
                        <option value="">Tanlang...</option>
                        <option value="student">O'quvchi</option>
                        <option value="teacher">O'qituvchi</option>
                    </select>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn btn-primary">Ro'yxatdan o'tish</button>
            </form>

            <p>Allaqachon akkauntingiz bormi? <a href="login.html">Kirish</a></p>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 English Learning Platform. Barcha huquqlar himoyalangan.</p>
    </footer>

    <script src="js/register.js"></script>
</body>
</html>
